services:
  astro-dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Ensure container dev server binds to 0.0.0.0
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "4321:4321"
    # Mount project into /workspace so edits reflect immediately.
    # Preserve container-installed node_modules in a named volume so the container's node_modules aren't overwritten by the mount.
    volumes:
      - ./:/workspace:delegated
      - node_modules:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      # If file watchers are flaky, enable polling:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  node_modules:
