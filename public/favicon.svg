<?xml version="1.0" encoding="utf-8"?>
<!-- Cyberpunk-styled 'N' logo SVG - scalable, layered neon/glitch effects -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Cyberpunk N logo">
  <defs>
    <!-- Neon gradient -->
    <linearGradient id="neonGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#8A00FF" />
      <stop offset="100%" stop-color="#FF00D0" />
    </linearGradient>

    <!-- Secondary thin gradient for stroke highlight -->
    <linearGradient id="strokeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#A6FFF9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFD6FF" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" height="300%" width="300%" x="-100%" y="-100%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Stronger outer glow for duplicate pass -->
    <filter id="outerGlow" height="300%" width="300%" x="-100%" y="-100%">
      <feGaussianBlur stdDeviation="30" result="bigBlur" />
      <feMerge>
        <feMergeNode in="bigBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glitch clip paths to cut small horizontal bands for glitch effect -->
    <clipPath id="glitchBands">
      <!-- create several thin horizontal bands to show offset duplicates -->
      <rect x="0" y="0" width="1024" height="60" />
      <rect x="0" y="180" width="1024" height="20" />
      <rect x="0" y="320" width="1024" height="24" />
      <rect x="0" y="540" width="1024" height="18" />
      <rect x="0" y="720" width="1024" height="28" />
    </clipPath>

    <!-- subtle grain texture (tiny) -->
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>

    <!-- N path for reuse -->
    <path id="Nshape" d="M220 160 L340 160 L700 700 L700 160 L820 160 L820 864 L700 864 L340 320 L340 864 L220 864 Z" />
  </defs>

  <!-- Background: transparent but with subtle vertical glitch lines and faint vignette -->
  <rect width="100%" height="100%" fill="black" />

  <!-- faint vertical scanlines and noise -->
  <g opacity="0.06">
    <rect width="100%" height="100%" fill="url(#neonGrad)" filter="url(#grain)" />
  </g>

  <!-- Outer soft neon halo -->
  <use href="#Nshape" fill="none" stroke="url(#neonGrad)" stroke-width="60" filter="url(#outerGlow)" opacity="0.85" />

  <!-- Main fill with neon gradient and inner bevel illusion -->
  <g filter="url(#glow)">
    <use href="#Nshape" fill="url(#neonGrad)" />
    <!-- subtle glossy highlight overlay -->
    <use href="#Nshape" fill="none" stroke="url(#strokeGrad)" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Thin circuitry lines inside the N -->
  <!-- <g stroke="#A6FFF9" stroke-width="3" stroke-linecap="round" opacity="0.9" transform="translate(20,20)">
    <line x1="280" y1="220" x2="380" y2="320" />
    <circle cx="280" cy="220" r="6" fill="#A6FFF9" />
    <circle cx="380" cy="320" r="4" fill="#FFD6FF" />

    <line x1="470" y1="410" x2="600" y2="380" stroke-opacity="0.75" />
    <circle cx="600" cy="380" r="5" fill="#00F0FF" />

    <line x1="450" y1="580" x2="520" y2="640" stroke-opacity="0.7" />
    <circle cx="520" cy="640" r="4" fill="#FF00D0" />
  </g> -->

  <!-- Small decorative diagonal cuts / slashes for cyber aesthetic -->
  <!-- <g fill="#000" opacity="0.22">
    <rect x="330" y="210" width="40" height="10" transform="rotate(-35 350 215)" />
    <rect x="560" y="470" width="50" height="10" transform="rotate(-25 585 475)" />
    <rect x="360" y="720" width="48" height="10" transform="rotate(-15 384 725)" />
  </g> -->

  <!-- Glitch duplicate passes (slightly offset, different tint) clipped into thin bands -->
  <g clip-path="url(#glitchBands)">
    <!-- cyan offset -->
    <use href="#Nshape" fill="none" stroke="#00F0FF" stroke-width="28" transform="translate(-8,6)" opacity="0.9" />
    <!-- magenta offset -->
    <use href="#Nshape" fill="none" stroke="#FF00D0" stroke-width="28" transform="translate(10,-6)" opacity="0.85" />
  </g>

  <!-- Fine white sheen to give a polished neon edge -->
  <use href="#Nshape" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Small 'board' etch lines to reinforce cyber theme (subtle) -->
  <!-- <g stroke-opacity="0.35" stroke-linecap="round">
    <line x1="320" y1="760" x2="400" y2="680" stroke="#8A00FF" stroke-width="2" />
    <line x1="360" y1="800" x2="440" y2="720" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="560" y1="220" x2="640" y2="300" stroke="#FF00D0" stroke-width="2" />
  </g> -->
</svg>
